apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-and-push-run-001
  namespace: poc-tekton
spec:
  pipelineRef:
    name: build-and-push-poc   # ต้องตรงกับชื่อ Pipeline

  params:
    - name: quay.io/phatthananvst01/quaytekton
      value: quay.io/myorg/poc-tekton
    - name: IMAGE_TAG
      value: v1.0.0

  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

  serviceAccountName: pipeline-sa
