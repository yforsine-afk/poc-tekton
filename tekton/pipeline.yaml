apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-and-push-poc
  namespace: poc-tekton
spec:
  params:
    - name: GIT_URL
      type: string
      default: https://github.com/yforsine-afk/poc-tekton.git
    - name: GIT_REVISION
      type: string
      default: main
    - name: IMAGE_NAME
      type: string
      default: quay.io/phatthananvst01/quaytekton
    - name: IMAGE_TAG
      type: string
      default: v1.0.0

  workspaces:
    - name: shared-workspace

  tasks:
    # STEP 1: clone source code 
    - name: clone-repo
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.GIT_URL)
        - name: revision
          value: $(params.GIT_REVISION)
      workspaces:
        - name: output
          workspace: shared-workspace

    # STEP 2: build & push image ด้วย Kaniko 
    - name: build-and-push
      runAfter:
        - clone-repo
      taskRef:                 # เพิ่มตรงนี้
        name: kaniko            # ต้องตรงกับ `oc get task`
      params:
        - name: IMAGE
          value: $(params.IMAGE_NAME):$(params.IMAGE_TAG)
      workspaces:
        - name: source
          workspace: shared-workspace
